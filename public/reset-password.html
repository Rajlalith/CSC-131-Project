<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Reset Password - EzPremium Tutors</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .login-container {
      background-color: white;
      padding: 2rem;
      border-radius: 10px;
      width: 100%;
      max-width: 400px;
      margin: 5rem auto;
      box-shadow: 0 4px 10px rgba(0,0,0,0.2);
      text-align: center;
    }
    .login-container h2 {
      margin-bottom: 1.5rem;
      color: #333;
    }
    .login-container input {
      width: 100%;
      padding: 0.5rem;
      margin: 0.5rem 0;
      font-size: 1rem;
    }
    #message {
      margin-top: 1rem;
      font-size: 0.95rem;
    }
    .btn-signin {
      width: 100%;
      padding: 0.7rem;
      background-color: #f57c00;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 1rem;
    }
  </style>
</head>
<body class="login-body">
  <div class="login-container">
    <h2>Reset Your Password</h2>
    <form id="resetForm">
      <input type="password" id="newPassword" placeholder="New Password" required />
      <input type="password" id="confirmPassword" placeholder="Confirm Password" required />
      <button type="submit" class="btn-signin">Reset Password</button>
    </form>
    <p id="message"></p>
  </div>

  <script>
    const token = new URLSearchParams(window.location.search).get("token");
    const form = document.getElementById("resetForm");
    const message = document.getElementById("message");

    if (!token) {
      message.style.color = "red";
      message.textContent = "❌ Invalid or missing token.";
      form.style.display = "none";
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const password = document.getElementById("newPassword").value.trim();
      const confirm = document.getElementById("confirmPassword").value.trim();

      if (password !== confirm) {
        message.style.color = "red";
        message.textContent = "Passwords do not match!";
        return;
      }

      try {
        const res = await fetch(`http://localhost:5000/api/auth/reset-password/${token}`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password }),
        });

        const data = await res.json();
        if (!res.ok) throw new Error(data.message);

        message.style.color = "green";
        message.textContent = "✅ Password reset successfully. Redirecting to login...";
        setTimeout(() => window.location.href = "login.html", 3000);
      } catch (err) {
        message.style.color = "red";
        message.textContent = err.message || "Something went wrong.";
      }
    });
  </script>
</body>
</html>
