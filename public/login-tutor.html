<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Login - Tutor</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="login-body home-bg">
  <div class="glow-circle"></div>
  <div class="glow-circle delay-1"></div>
  <div class="glow-circle delay-2"></div>

  <div class="login-container">
    <div class="login-icon">👤</div>
    <h2 class="login-heading">Tutor Login</h2>

    <form id="tutorLoginForm">
      <input type="email" id="tutorEmail" placeholder="Email" required />
      <input type="password" id="tutorPassword" placeholder="Password" required />
      <button type="submit" class="btn-signin">Sign in</button>
      <a href="forgot-password.html" class="forgot-link">Forgot password?</a>
    </form>

    <p class="footer-links">
      A student? <a href="login.html">Click here</a><br />
      Don’t have an account? <a href="signup-tutor.html">Sign up</a>
    </p>
  </div>

  <script>
    const baseURL = "http://localhost:5000/api";

    document.getElementById("tutorLoginForm").addEventListener("submit", async function (e) {
      e.preventDefault();

      const email = document.getElementById("tutorEmail").value.trim();
      const password = document.getElementById("tutorPassword").value.trim();

      try {
        const res = await fetch(`${baseURL}/auth/login`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });

        const data = await res.json();

        if (!res.ok) {
          if (res.status === 403) {
            alert("❌ Email not verified. Redirecting to OTP verification...");
            sessionStorage.setItem("pendingVerificationEmail", email);
            return window.location.href = "verify-otp.html";
          }
          throw new Error(data.message || "Login failed");
        }

        localStorage.setItem("token", data.token);
        localStorage.setItem("role", data.role);
        localStorage.setItem("userEmail", data.user.email);
        localStorage.setItem("userName", data.user.name);

        if (data.role === "tutor") {
          window.location.href = "homepage-tutor.html";
        } else {
          alert("This is not a tutor account.");
        }
      } catch (err) {
        console.error("Login error:", err);
        alert("Login failed: " + err.message);
      }
    });
  </script>
</body>
</html>
