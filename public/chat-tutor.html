<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tutor Chat - EzPremium Tutors</title>
  <link rel="stylesheet" href="styles.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script type="module" src="https://cdn.jsdelivr.net/npm/emoji-picker-element@^1/index.js"></script>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      height: 100vh;
      display: flex;
      background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
    }
    .sidebar-navigation {
      width: 90px;
      background-color: #fcefd4;
      padding-top: 2rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.5rem;
      min-height: 100vh;
    }
    .sidebar-navigation a {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-decoration: none;
    }
    .sidebar-navigation img {
      width: 30px;
      height: 30px;
      margin-bottom: 5px;
    }
    .sidebar-navigation span {
      font-size: 0.8rem;
      color: black;
      font-weight: bold;
      text-align: center;
    }
    .user-list-sidebar {
      width: 300px;
      background-color: #fff;
      display: flex;
      flex-direction: column;
      border-right: 1px solid #ccc;
    }
    .user-controls {
      padding: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      border-bottom: 1px solid #ccc;
    }
    .user-controls button {
      font-size: 0.85rem;
      padding: 0.4rem 0.6rem;
      background-color: #f57c00;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
    }
    .search-bar {
      padding: 1rem;
      border-bottom: 1px solid #ccc;
    }
    .search-bar input {
      width: 100%;
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .user-list {
      flex-grow: 1;
      overflow-y: auto;
    }
    .user-item {
      padding: 1rem;
      border-bottom: 1px solid #eee;
      cursor: pointer;
      transition: background 0.3s;
    }
    .user-item:hover {
      background-color: #f5f5f5;
    }
    .selected-user {
      background-color: #cfe3ff !important;
    }
    .chat-area {
      flex-grow: 1;
      display: flex;
      flex-direction: column;
      background: #f4f4f4;
    }
    .chat-header {
      padding: 1rem;
      background: #fcefd4;
      font-weight: bold;
      border-bottom: 1px solid #ccc;
    }
    .messages {
      flex-grow: 1;
      padding: 1rem;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
    }
    .message {
      margin-bottom: 1rem;
      max-width: 70%;
      padding: 0.8rem;
      border-radius: 10px;
      clear: both;
      word-wrap: break-word;
      position: relative;
    }
    .message img {
      max-width: 200px;
      border-radius: 8px;
    }
    .message .actions {
      position: absolute;
      top: 4px;
      right: 6px;
      display: flex;
      gap: 6px;
    }
    .message .actions button {
      background: transparent;
      border: none;
      cursor: pointer;
      font-size: 0.8rem;
      color: #444;
    }
    .sent {
      background-color: #d1e7dd;
      margin-left: auto;
      text-align: right;
    }
    .received {
      background-color: #fff;
      margin-right: auto;
      text-align: left;
    }
    .send-bar {
      display: flex;
      flex-direction: column;
      padding: 1rem;
      border-top: 1px solid #ccc;
      background: white;
    }
    .preview-box {
      display: none;
      align-items: center;
      gap: 10px;
      background: #f1f1f1;
      border-radius: 6px;
      padding: 6px 10px;
      margin-bottom: 8px;
      font-size: 0.85rem;
      color: #333;
    }
    .clear-btn {
      background: transparent;
      border: none;
      color: #d00;
      font-size: 1rem;
      cursor: pointer;
    }
    .send-controls {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }
    .send-controls input[type="text"] {
      flex-grow: 1;
      padding: 0.5rem;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    .send-controls button {
      padding: 0.5rem 1rem;
      background-color: #f57c00;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    #imageInput, #fileInput {
      display: none;
    }
  </style>
</head>
<body>
  <div class="sidebar-navigation">
    <a href="tutor-profile.html"><img src="https://img.icons8.com/ios-filled/50/user.png" alt="Profile" /><span>Profile</span></a>
    <a href="chat-tutor.html"><img src="https://img.icons8.com/ios-filled/50/topic.png" alt="Messages" /><span><strong>Messages</strong></span></a>
    <a href="tutor-payroll.html"><img src="https://img.icons8.com/ios-filled/50/money.png" alt="Payroll" /><span>Payroll</span></a>
    <a href="tutor-session-history.html"><img src="https://img.icons8.com/ios-filled/50/clock--v1.png" alt="History" /><span>History</span></a>
    <a href="tutor-schedule.html"><img src="https://img.icons8.com/ios-filled/50/planner.png" alt="Schedule" /><span>Schedule</span></a>
  </div>

  <div class="user-list-sidebar">
    <div class="user-controls">
      <button onclick="window.location.href='tutor-dashboard.html'">← Dashboard</button>
      <button onclick="logoutUser()">Logout</button>
    </div>
    <div class="search-bar">
      <input type="text" id="searchInput" placeholder="Search students...">
    </div>
    <div class="user-list" id="userList">Loading students...</div>
  </div>

  <div class="chat-area">
    <div class="chat-header" id="chatHeader">Select a student</div>
    <div class="messages" id="messages"></div>

    <div class="send-bar">
      <div id="filePreview" class="preview-box">
        <span id="previewText"></span>
        <button class="clear-btn" onclick="clearPreview()">❌</button>
      </div>
      <div class="send-controls">
        <input type="text" id="messageInput" placeholder="Type a message..." />
        <button onclick="toggleEmojiPicker()">😄</button>
        <button onclick="document.getElementById('imageInput').click()">📷</button>
        <button onclick="uploadFile()">📎</button>
        <button onclick="sendMessage()">Send</button>
      </div>
    </div>

    <input type="file" id="imageInput" accept="image/*" />
    <input type="file" id="fileInput" />
    <emoji-picker id="emojiPicker" style="width:100%; display:none;"></emoji-picker>
  </div>

  <script src="https://cdn.socket.io/4.5.4/socket.io.min.js"></script>
  <script src="js/chat.js"></script>
  <script src="js/logout.js"></script>
</body>
</html>
